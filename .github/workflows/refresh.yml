# Refreshes every source, rebuilds and publishes, every 6 hours and on demand.
# A source that fails keeps its previous data (see scripts/harvest.mjs).
#
# Publishing (set in Settings > Secrets and variables > Actions):
# - Cloudflare: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Uses wrangler.jsonc.
# - GitHub Pages: variable DEPLOY_PAGES=true, and Settings > Pages > Source: GitHub Actions.
# With neither, the workflow only refreshes and commits the data.
name: Refresh and publish
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ATLAS_PROFILE: ${{ vars.ATLAS_PROFILE || 'profiles/offchain-media' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized pictures are not committed; the cache keeps them between runs so only new ones are fetched.
      - uses: actions/cache@v4
        with:
          path: data/images
          key: images-${{ github.run_id }}
          restore-keys: images-
      - run: npm run harvest
      - run: npm test
      - run: npm run build
      - name: Commit refreshed data once a day
        run: |
          # Scheduled runs commit only at the 00:17 UTC run; manual runs always commit.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "00" ]; then exit 0; fi
          git config user.name "community-atlas-bot"
          git config user.email "community-atlas-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Publish to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      # GitHub Pages serves the artifact at the site's path, so upload the folder of the first language path.
      - name: Folder for GitHub Pages
        id: pages
        if: vars.DEPLOY_PAGES == 'true'
        run: echo "dir=public$(node -p "require('./' + process.env.ATLAS_PROFILE + '/profile.json').languages[0].path")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: ${{ steps.pages.outputs.dir }}
  pages:
    needs: refresh
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
